name: Daily technical signal lab

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the broad post-close snapshot and opportunity hunt.
    - cron: '45 23 * * 1-5'

permissions:
  contents: read

concurrency:
  group: daily-technical-signal-lab
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Require persistent database
        run: test -n "${DATABASE_URL}" || (echo "DATABASE_URL is required" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Record and evaluate virtual technical signals
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
        run: python -m scripts.run_daily_signal_lab
