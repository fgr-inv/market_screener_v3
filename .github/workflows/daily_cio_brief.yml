name: Daily CIO Brief

on:
  workflow_dispatch:
  schedule:
    # Two UTC slots cover 07:30 New York across DST and standard time; the script accepts only the local 07:30 slot.
    - cron: '30 11,12 * * 1-5'

permissions:
  contents: read

concurrency:
  group: investment-desk-daily-cio
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Require persistent database
        run: test -n "${DATABASE_URL}" || (echo "DATABASE_URL is required" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build pre-market CIO brief
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -m scripts.run_daily_cio_brief
