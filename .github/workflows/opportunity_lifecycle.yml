name: Opportunity lifecycle and shadow book

on:
  workflow_dispatch:
  schedule:
    # After snapshot, opportunity hunt, and the daily technical Signal Lab.
    - cron: '15 0 * * 2-6'

permissions:
  contents: read

concurrency:
  group: opportunity-lifecycle-shadow-book
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Require persistent database
        run: test -n "${DATABASE_URL}" || (echo "DATABASE_URL is required" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Update evidence gates and virtual Shadow Book
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
        run: python -m scripts.run_opportunity_lifecycle
