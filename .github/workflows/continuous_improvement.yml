name: Weekly continuous improvement review

on:
  workflow_dispatch:
  schedule:
    # Saturday after Shadow validation and the descriptive skill-calibration review.
    - cron: '30 15 * * 6'

permissions:
  contents: read

concurrency:
  group: weekly-continuous-improvement
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python
      - name: Require persistent database
        run: test -n "${DATABASE_URL}" || (echo "DATABASE_URL is required" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run bounded champion challenger review
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
        run: python -m scripts.run_continuous_improvement_review
