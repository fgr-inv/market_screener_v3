name: Daily opportunity hunt

on:
  workflow_dispatch:
  schedule:
    # Runs after the broad daily snapshot in both New York daylight and standard time.
    - cron: '10 23 * * 1-5'

permissions:
  contents: read

concurrency:
  group: investment-desk-daily-opportunity-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Require persistent database
        run: test -n "${DATABASE_URL}" || (echo "DATABASE_URL is required" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Discover, verify and persist daily opportunities
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -m scripts.run_daily_opportunity_hunt
