name: Daily market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '20 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: daily-market-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.daily_refresh
        env:
          PYTHONPATH: ${{ github.workspace }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Keep rolling 180 daily snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path('data/snapshots').glob('history_scores_*.parquet'))
          for p in files[:-180]: p.unlink()
          PY
      - name: Commit snapshots
        run: |
          git config user.name "market-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "chore: refresh market snapshot"
          git push
