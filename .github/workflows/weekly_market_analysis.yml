name: Weekly macro and sector analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 6'

permissions:
  contents: read

concurrency:
  group: weekly-macro-sector-analysis
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python
      - name: Require persistent database
        run: test -n "${DATABASE_URL}" || (echo "DATABASE_URL is required" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build, verify and deliver weekly report
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m scripts.run_weekly_market_analysis
