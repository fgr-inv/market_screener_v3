name: Automation resilience and catch-up

on:
  workflow_dispatch:
  schedule:
    # Independent checks after the premarket and post-close automation windows.
    - cron: '15 15 * * 1-5'
    - cron: '15 2 * * 2-6'
    - cron: '0 18 * * 6'

permissions:
  contents: write

concurrency:
  group: automation-resilience
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Require persistent database
        run: test -n "${DATABASE_URL}" || (echo "DATABASE_URL is required" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Recover missed durable processes once
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m scripts.run_automation_recovery
      - name: Persist a recovered market snapshot
        if: always()
        run: |
          git config user.name "market-screener-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "chore: recover market snapshot"
          git pull --rebase origin main
          git push origin main
