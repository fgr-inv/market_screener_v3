name: Weekly shadow skill calibration

on:
  workflow_dispatch:
  schedule:
    # Saturday review after the Friday post-close forward-validation run.
    - cron: '30 13 * * 6'

permissions:
  contents: read

concurrency:
  group: weekly-shadow-skill-calibration
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Require persistent database
        run: test -n "${DATABASE_URL}" || (echo "DATABASE_URL is required" && exit 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Review shadow skill evidence
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
        run: python -m scripts.run_skill_calibration_review
