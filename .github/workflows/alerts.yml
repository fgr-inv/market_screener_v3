name: Market alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market alerts
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m scripts.run_alerts

      - name: Persist fallback alert state
        if: always()
        run: |
          if [ -f data/alert_state.csv ]; then
            git config user.name "market-screener-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/alert_state.csv
            git diff --cached --quiet || git commit -m "chore: persist alert state"
            git push
          fi
