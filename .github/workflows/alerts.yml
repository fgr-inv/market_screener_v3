name: Market alerts

on:
  workflow_dispatch:
  schedule:
    # Faster during the US market window; hourly coverage remains active for crypto/off-hours.
    - cron: '*/15 13-21 * * 1-5'
    - cron: '0 0-12,22-23 * * 1-5'
    - cron: '0 * * * 0,6'

permissions:
  contents: read

concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market alerts
        id: market_alerts
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m scripts.run_alerts

      - name: Check automation freshness
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_USER_ID: ${{ secrets.DEV_USER_ID }}
          ALERT_RUN_STATUS: ${{ steps.market_alerts.outcome }}
        run: python -m scripts.run_automation_watchdog
